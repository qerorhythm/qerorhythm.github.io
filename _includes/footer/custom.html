<script>
  document.addEventListener("DOMContentLoaded", function () {
    var pageContent = document.querySelector(".page__content");
    var tocElement = document.querySelector("nav.toc");
    var tocAside = document.querySelector("aside.sidebar__right");

    if (!pageContent || !tocElement) return;

    // 1. 目次にIDを付与
    if (!tocElement.id) {
      tocElement.id = "page-toc";
    }

    // 2. 本文の「最初の見出し」を正しく探す（目次の中のH4は絶対に除外する！）
    var allHeadings = pageContent.querySelectorAll("h2, h3, h4");
    var firstHeading = null;
    for (var i = 0; i < allHeadings.length; i++) {
      if (
        !allHeadings[i].closest(".toc") &&
        !allHeadings[i].closest(".sidebar__right")
      ) {
        firstHeading = allHeadings[i];
        break;
      }
    }

    // 3. スマホ時の目次の位置を自動調整
    if (tocAside) {
      var customPos = document.getElementById("toc-here");
      if (customPos) {
        customPos.parentNode.insertBefore(tocAside, customPos);
      } else if (firstHeading) {
        // 見出しの手前に横線 <hr> があるか探す
        var prev = firstHeading.previousElementSibling;
        var hrTarget = null;

        if (prev && prev.tagName === "HR") {
          hrTarget = prev;
        } else if (
          prev &&
          prev.previousElementSibling &&
          prev.previousElementSibling.tagName === "HR"
        ) {
          hrTarget = prev.previousElementSibling;
        }

        if (hrTarget) {
          // 横線の手前に目次を置く → [前書き] → [目次] → [横線] → [見出し]
          hrTarget.parentNode.insertBefore(tocAside, hrTarget);
        } else {
          // 横線がなければ見出しの直前に置く
          firstHeading.parentNode.insertBefore(tocAside, firstHeading);
        }
      }
    }

    // 4. 見出しタップで目次へ戻る機能（本文の見出しだけに付与）
    allHeadings.forEach(function (heading) {
      // 目次内のタイトルには矢印を付けない
      if (heading.closest(".toc") || heading.closest(".sidebar__right")) return;

      var backLink = document.createElement("a");
      backLink.className = "toc-back-arrow";
      backLink.href = "#page-toc";
      backLink.title = "目次へ戻る";
      backLink.innerHTML = '<i class="fas fa-arrow-up"></i>';
      heading.appendChild(backLink);

      heading.style.cursor = "pointer";
      heading.addEventListener("click", function (e) {
        if (e.target.tagName !== "A") {
          tocElement.scrollIntoView({ behavior: "smooth" });
        }
      });
    });
  });
</script>
